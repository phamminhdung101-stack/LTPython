<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách tài liệu - DocUni</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../static/css/student.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="home.html" class="flex-shrink-0 flex items-center gap-2">
                        <i class="fas fa-graduation-cap text-brand-600 text-2xl"></i>
                        <span class="font-bold text-xl text-gray-900 tracking-tight">DocUni</span>
                    </a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="home.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Trang chủ</a>
                        <a href="document_list.html" class="border-brand-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Danh sách tài liệu</a>
                    </div>
                </div>
                <!-- Mini Search in Navbar -->
                <div class="hidden md:flex flex-1 items-center justify-center px-8">
                    <div class="w-full max-w-lg relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="navSearch" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-1 focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition-colors" placeholder="Tìm tài liệu...">
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="#" class="text-gray-500 hover:text-brand-600 transition-colors">
                        <i class="fas fa-bell text-xl"></i>
                    </a>
                    <div class="flex items-center gap-2 border-l pl-4 border-gray-200">
                        <img class="h-8 w-8 rounded-full border border-gray-200" src="https://ui-avatars.com/api/?name=Sinh+Vien&background=0ea5e9&color=fff" alt="User">
                        <span class="text-sm font-medium text-gray-700 hidden md:block">Xin chào, Sinh viên</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar (Filters) -->
            <div class="w-full lg:w-64 flex-shrink-0">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sticky top-24">
                    <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-100">
                        <h3 class="font-bold text-gray-900 text-lg">Bộ lọc</h3>
                        <button onclick="resetFilters()" class="text-sm text-brand-600 hover:text-brand-800">Xóa lọc</button>
                    </div>

                    <!-- Môn học -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-900 mb-3 text-sm">Môn học</h4>
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="subject-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="IT101" checked>
                                <span class="ml-2">Nhập môn lập trình (IT101)</span>
                            </label>
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="subject-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="IT202">
                                <span class="ml-2">Cấu trúc dữ liệu (IT202)</span>
                            </label>
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="subject-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="ECO101">
                                <span class="ml-2">Kinh tế vi mô (ECO101)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Khoa -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-900 mb-3 text-sm">Khoa quản lý</h4>
                        <select id="facultyFilter" class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-brand-500 focus:border-brand-500 sm:text-sm bg-white">
                            <option value="">Tất cả khoa</option>
                            <option value="CNTT">Công nghệ thông tin</option>
                            <option value="KT">Kinh tế</option>
                        </select>
                    </div>

                    <!-- Loại tài liệu -->
                    <div class="mb-6">
                        <h4 class="font-medium text-gray-900 mb-3 text-sm">Loại tài liệu</h4>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="type-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="book">
                                <span class="ml-2">Giáo trình</span>
                            </label>
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="type-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="slide">
                                <span class="ml-2">Bài giảng (Slide)</span>
                            </label>
                            <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                                <input type="checkbox" class="type-filter rounded text-brand-600 focus:ring-brand-500 h-4 w-4 border-gray-300" value="exam">
                                <span class="ml-2">Đề thi</span>
                            </label>
                        </div>
                    </div>
                    
                    <button onclick="applyFilters()" class="w-full bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        Áp dụng lọc
                    </button>
                </div>
            </div>

            <!-- Documents List -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-gray-900">Kết quả tìm kiếm (<span id="resultCount">12</span>)</h2>
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-gray-500">Sắp xếp:</label>
                        <select class="block w-full pl-3 pr-8 py-1.5 text-sm border-gray-300 rounded-md focus:ring-brand-500 focus:border-brand-500">
                            <option>Mới nhất</option>
                            <option>Tải nhiều nhất</option>
                            <option>Đánh giá cao</option>
                        </select>
                    </div>
                </div>

                <!-- Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6" id="documentsGrid">
                    <!-- Cards will be populated by JS -->
                </div>

                <!-- Pagination -->
                <div class="mt-10 flex items-center justify-center">
                    <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                        <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">Previous</span>
                            <i class="fas fa-chevron-left"></i>
                        </a>
                        <a href="#" aria-current="page" class="z-10 bg-brand-50 border-brand-500 text-brand-600 relative inline-flex items-center px-4 py-2 border text-sm font-medium">1</a>
                        <a href="#" class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">2</a>
                        <a href="#" class="bg-white border-gray-300 text-gray-500 hover:bg-gray-50 relative inline-flex items-center px-4 py-2 border text-sm font-medium">3</a>
                        <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                            <span class="sr-only">Next</span>
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </nav>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">&copy; 2026 DocUni. All rights reserved.</p>
        </div>
    </footer>

    <!-- JS -->
    <script src="../../static/js/student.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof renderDocumentList === 'function') {
                renderDocumentList();
            }
        });
    </script>
</body>
</html>
